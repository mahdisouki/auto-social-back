version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: autosocial-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: autosocial
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - autosocial-network

  # Node.js API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autosocial-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/autosocial?authSource=admin
    volumes:
      # Uploads volume removed - using Cloudinary for image storage
      - ./logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - autosocial-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  autosocial-network:
    driver: bridge
